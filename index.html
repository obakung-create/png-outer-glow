<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Result Composer</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#ff5200}
  @media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#232326;--text:#f5f5f7;--muted:#98989d;--line:#3a3a3e}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .sec{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:20px 0 8px}
  .sec:first-child{margin-top:0}
  .ups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .up{position:relative;height:112px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;color:var(--muted);font-size:12px;cursor:pointer;overflow:hidden;background-size:contain;background-position:center;background-repeat:no-repeat;transition:.15s}
  .up b{font-size:14px;color:var(--text)}
  .up.over{border-color:var(--accent);color:var(--accent)}
  .up.has{border-style:solid;color:#fff;justify-content:flex-end;background-color:#2b2b2e}
  .up.has b,.up.has small{color:#fff;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.45);width:100%;padding:2px 0}
  .up .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
  .ratios{display:flex;flex-wrap:wrap;gap:6px}
  .ratios button,.tabs button,.mini{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .ratios button.on,.tabs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .ratios small{color:var(--muted);font-size:10px;display:block}
  button:disabled{opacity:.4;cursor:not-allowed}
  label{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 6px}
  label span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center}
  input[type=color]{width:48px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:none;cursor:pointer}
  input[type=text]{flex:1;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--card);color:var(--text);font-family:ui-monospace,monospace}
  .mini{margin-top:10px;width:100%}
  button.dl{width:100%;margin-top:20px;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .stage{height:min(72vh,780px);min-height:340px;border-radius:10px;background:#2b2b2e;overflow:hidden}
  .stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .info{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>Run Result Composer</h1>
  <div class="grid">
    <div class="card">
      <div class="sec">อัปโหลด</div>
      <div class="ups">
        <div class="up" id="upBg" data-slot="bg"><b>รูปวิ่ง</b><small>พื้นหลัง</small><button class="x" hidden title="ลบ">×</button></div>
        <div class="up" id="upFg" data-slot="fg"><b>ผลวิ่ง</b><small>ภาพที่แปะ</small><button class="x" hidden title="ลบ">×</button></div>
      </div>
      <input id="fileBg" type="file" accept="image/*" hidden>
      <input id="fileFg" type="file" accept="image/*" hidden>

      <div class="sec">สัดส่วนรูปวิ่ง (Crop)</div>
      <div class="ratios" id="ratios">
        <button data-r="4:5" class="on">4:5<small>FB / IG</small></button>
        <button data-r="9:16">9:16<small>Stories</small></button>
        <button data-r="16:9">16:9<small>แนวนอน</small></button>
        <button data-r="1:1">1:1<small>สี่เหลี่ยม</small></button>
        <button data-r="free">อิสระ</button>
      </div>
      <label><span>ซูมรูปวิ่ง</span><span id="vZoom">100 %</span></label>
      <input id="zoom" type="range" min="100" max="500" value="100" disabled>
      <button class="mini" id="resetBg" disabled>รีเซ็ตครอปรูปวิ่ง</button>

      <div class="sec">ผลวิ่ง</div>
      <label><span>ขนาด (% ของความกว้างภาพ)</span><span id="vF">60 %</span></label>
      <input id="fsize" type="range" min="5" max="200" value="60" disabled>
      <button class="mini" id="resetFg" disabled>รีเซ็ตครอปผลวิ่ง</button>

      <div class="sec">Outer Glow (ผลวิ่ง)</div>
      <label><span>ขนาด (Size)</span><span id="vSize">25 px</span></label>
      <input id="size" type="range" min="0" max="100" value="25">
      <label><span>สี (Color)</span></label>
      <div class="row">
        <input id="color" type="color" value="#000000">
        <input id="hex" type="text" value="#000000" maxlength="7">
      </div>
      <label><span>ความเข้ม (Opacity)</span><span id="vOp">55 %</span></label>
      <input id="op" type="range" min="0" max="100" value="55">
      <label><span>Spread</span><span id="vSp">0 %</span></label>
      <input id="sp" type="range" min="0" max="100" value="0">
      <label><span>เพิ่มความหนา (Passes)</span><span id="vPass">2</span></label>
      <input id="pass" type="range" min="1" max="6" value="2">

      <button class="dl" id="dl" disabled>ดาวน์โหลด PNG</button>
    </div>

    <div class="card">
      <div class="tabs" id="tabs">
        <button id="tBg" data-m="bg" disabled>① ครอปรูปวิ่ง</button>
        <button id="tCmp" data-m="compose" disabled class="on">② จัดวาง + Effect</button>
        <button id="tFg" data-m="fg" disabled>③ ครอปผลวิ่ง</button>
      </div>
      <div class="stage" id="stage"><canvas id="cv"></canvas></div>
      <div class="hint" id="hint"></div>
      <div class="info" id="info"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const RATIOS = {
  '4:5':{r:4/5,W:1080,H:1350}, '9:16':{r:9/16,W:1080,H:1920},
  '16:9':{r:16/9,W:1920,H:1080}, '1:1':{r:1,W:1080,H:1080}, 'free':{r:null}
};
const HINTS = {
  bg:'ลากในกรอบเพื่อเลื่อน · ลากมุม/ขอบเพื่อย่อ-ขยายพื้นที่ครอป · เลื่อนล้อเมาส์หรือใช้แถบซูมเพื่อซูม',
  compose:'ลากผลวิ่งเพื่อย้าย · ลากมุมเพื่อย่อ-ขยาย · เลื่อนล้อเมาส์เพื่อปรับขนาด · ปรับ Outer Glow ที่แผงซ้าย',
  fg:'ครอปผลวิ่งแบบอิสระ: ลากขอบ/มุมเพื่อกำหนดพื้นที่ · ลากในกรอบเพื่อเลื่อน'
};

let bgImg=null, fgImg=null, bgName='', fgName='', fgVer=0;
let ratio='4:5', bgCrop=null, fgCrop=null;
let fgT = {nx:.5, ny:.5, fw:.6};     // fg centre (0..1 of output) and width (fraction of output width)
let mode='compose', view=null, drag=null;
const urls = {bg:null, fg:null};
const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');
const outCv=document.createElement('canvas');
let glowCache={key:''};

/* ---------- geometry helpers ---------- */
function maxRect(img, r){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  if(!r) return {x:0,y:0,w:iw,h:ih};
  let w,h; if(iw/ih>r){h=ih;w=h*r}else{w=iw;h=w/r}
  return {x:(iw-w)/2,y:(ih-h)/2,w,h};
}
function scaleRect(c,k,img){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  k=Math.min(k, iw/c.w, ih/c.h); k=Math.max(k, 16/c.w, 16/c.h);
  const w=c.w*k, h=c.h*k, cx=c.x+c.w/2, cy=c.y+c.h/2;
  return {x:clamp(cx-w/2,0,iw-w), y:clamp(cy-h/2,0,ih-h), w, h};
}
function resizeCrop(s,handle,px,py,r,iw,ih){
  const MIN=16, L=s.x,T=s.y,R=s.x+s.w,B=s.y+s.h;
  const hw=handle.includes('w'), he=handle.includes('e'), hn=handle.includes('n'), hs=handle.includes('s');
  if(!r){
    let l=L,t=T,rr=R,b=B;
    if(hw) l=clamp(px,0,R-MIN);  if(he) rr=clamp(px,L+MIN,iw);
    if(hn) t=clamp(py,0,B-MIN);  if(hs) b=clamp(py,T+MIN,ih);
    return {x:l,y:t,w:rr-l,h:b-t};
  }
  const sx=he?1:-1, sy=hs?1:-1, ax=sx>0?L:R, ay=sy>0?T:B;
  const wmax=Math.min(sx>0?iw-ax:ax, (sy>0?ih-ay:ay)*r);
  let w=Math.max(Math.abs(px-ax), Math.abs(py-ay)*r);
  w=clamp(w, Math.min(MIN*Math.max(1,r),wmax), wmax);
  const h=w/r;
  return {x:sx>0?ax:ax-w, y:sy>0?ay:ay-h, w, h};
}
function handlePts(x,y,w,h,locked){
  const p={nw:[x,y],ne:[x+w,y],sw:[x,y+h],se:[x+w,y+h]};
  if(!locked){p.n=[x+w/2,y];p.s=[x+w/2,y+h];p.w=[x,y+h/2];p.e=[x+w,y+h/2]}
  return p;
}
function hitHandle(p,x,y){ for(const k in p) if(Math.hypot(p[k][0]-x,p[k][1]-y)<=14) return k; return null; }
const CURSORS={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize'};

/* ---------- layout / output size ---------- */
const padFor = () => Math.ceil(+$('size').value*1.5)+2;
function bgOut(){
  const R=RATIOS[ratio]; if(R.W) return [R.W,R.H];
  const k=Math.min(1,4096/Math.max(bgCrop.w,bgCrop.h));
  return [Math.round(bgCrop.w*k), Math.round(bgCrop.h*k)];
}
function layout(){
  if(bgImg){
    const [W,H]=bgOut();
    const ow=Math.max(1,Math.round(fgT.fw*W));
    return {W,H,ow,oh:fgImg?Math.max(1,Math.round(ow*fgCrop.h/fgCrop.w)):0,cx:fgT.nx*W,cy:fgT.ny*H,hasBg:true};
  }
  if(fgImg){
    const p=padFor(), ow=Math.round(fgCrop.w), oh=Math.round(fgCrop.h);
    return {W:ow+2*p,H:oh+2*p,ow,oh,cx:(ow+2*p)/2,cy:(oh+2*p)/2,hasBg:false};
  }
  return null;
}
function defaultFw(){
  if(!bgImg||!fgCrop) return .6;
  const [W,H]=bgOut();
  return Math.min(.6, .8*H/W*fgCrop.w/fgCrop.h);
}

/* ---------- glow ---------- */
function glowFor(ow,oh){
  const size=+$('size').value, op=+$('op').value/100, spread=+$('sp').value/100,
        passes=+$('pass').value, color=$('color').value;
  const key=[fgVer,fgCrop.x,fgCrop.y,fgCrop.w,fgCrop.h,ow,oh,size,op,spread,passes,color].join('|');
  if(glowCache.key===key) return glowCache;
  const pad=Math.ceil(size*1.5)+2;
  const base=document.createElement('canvas'); base.width=ow; base.height=oh;
  const bx=base.getContext('2d'); bx.imageSmoothingQuality='high';
  bx.drawImage(fgImg,fgCrop.x,fgCrop.y,fgCrop.w,fgCrop.h,0,0,ow,oh);

  const r=size*spread;
  const sil=document.createElement('canvas'); sil.width=ow+pad*2; sil.height=oh+pad*2;
  const sc=sil.getContext('2d');
  if(r>.5){
    const steps=Math.min(64,Math.max(16,Math.round(r*4)));
    for(let ring=1;ring>=.25;ring-=.25)
      for(let k=0;k<steps;k++){const a=k/steps*Math.PI*2; sc.drawImage(base,pad+Math.cos(a)*r*ring,pad+Math.sin(a)*r*ring)}
  }
  sc.drawImage(base,pad,pad);

  const out=document.createElement('canvas'); out.width=sil.width; out.height=sil.height;
  const c=out.getContext('2d'), OFF=100000+sil.width;
  if(size>0&&op>0){
    c.save(); c.shadowColor=color; c.shadowBlur=Math.max(0,size-r)*2; c.shadowOffsetX=OFF; c.globalAlpha=op;
    for(let i=0;i<passes;i++) c.drawImage(sil,-OFF,0);
    c.restore();
  }
  c.drawImage(base,pad,pad);
  glowCache={key,cv:out,pad};
  return glowCache;
}

/* ---------- render the final composite ---------- */
function renderTo(c,L){
  if(c.width!==L.W||c.height!==L.H){c.width=L.W;c.height=L.H}
  const x=c.getContext('2d'); x.clearRect(0,0,L.W,L.H);
  if(L.hasBg){ x.imageSmoothingQuality='high'; x.drawImage(bgImg,bgCrop.x,bgCrop.y,bgCrop.w,bgCrop.h,0,0,L.W,L.H); }
  if(fgImg){ const g=glowFor(L.ow,L.oh); x.drawImage(g.cv,Math.round(L.cx-L.ow/2-g.pad),Math.round(L.cy-L.oh/2-g.pad)); }
}

/* ---------- stage drawing ---------- */
const pat=document.createElement('canvas'); pat.width=pat.height=16;
{const p=pat.getContext('2d'); p.fillStyle='#fff'; p.fillRect(0,0,16,16); p.fillStyle='#d9d9d9'; p.fillRect(0,0,8,8); p.fillRect(8,8,8,8);}
function checker(x,y,w,h){ctx.save();ctx.translate(x,y);ctx.fillStyle=ctx.createPattern(pat,'repeat');ctx.fillRect(0,0,w,h);ctx.restore()}
function viewFor(iw,ih){
  const W=stage.clientWidth,H=stage.clientHeight,m=20,s=Math.min((W-2*m)/iw,(H-2*m)/ih);
  return {s,ox:(W-iw*s)/2,oy:(H-ih*s)/2};
}
let raf=0;
function redraw(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;draw()}); }
function draw(){
  const dpr=window.devicePixelRatio||1, W=stage.clientWidth, H=stage.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  view=null;
  if(mode==='bg'&&bgImg) drawCrop(bgImg,bgCrop,RATIOS[ratio].r!=null);
  else if(mode==='fg'&&fgImg) drawCrop(fgImg,fgCrop,false);
  else drawCompose(W,H);
}
function drawCrop(img,c,locked){
  const iw=img.naturalWidth, ih=img.naturalHeight; view=viewFor(iw,ih); const {s,ox,oy}=view;
  checker(ox,oy,iw*s,ih*s);
  ctx.drawImage(img,ox,oy,iw*s,ih*s);
  const rx=ox+c.x*s, ry=oy+c.y*s, rw=c.w*s, rh=c.h*s;
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.fillRect(ox,oy,iw*s,ry-oy); ctx.fillRect(ox,ry+rh,iw*s,oy+ih*s-ry-rh);
  ctx.fillRect(ox,ry,rx-ox,rh);   ctx.fillRect(rx+rw,ry,ox+iw*s-rx-rw,rh);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<3;i++){ctx.moveTo(rx+rw*i/3,ry);ctx.lineTo(rx+rw*i/3,ry+rh);ctx.moveTo(rx,ry+rh*i/3);ctx.lineTo(rx+rw,ry+rh*i/3)}
  ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(rx,ry,rw,rh);
  drawHandles(handlePts(rx,ry,rw,rh,locked));
  $('info').textContent=`พื้นที่ครอป ${Math.round(c.w)} × ${Math.round(c.h)} px (จากต้นฉบับ ${iw} × ${ih})`;
}
function drawHandles(p){
  ctx.fillStyle='#fff'; ctx.strokeStyle='#ff5200'; ctx.lineWidth=2;
  for(const k in p){ctx.beginPath();ctx.rect(p[k][0]-6,p[k][1]-6,12,12);ctx.fill();ctx.stroke()}
}
function fgRectDisplay(L){
  const {s,ox,oy}=view;
  return {x:ox+(L.cx-L.ow/2)*s, y:oy+(L.cy-L.oh/2)*s, w:L.ow*s, h:L.oh*s};
}
function drawCompose(W,H){
  const L=layout();
  if(!L){
    ctx.fillStyle='#98989d'; ctx.font='14px system-ui'; ctx.textAlign='center';
    ctx.fillText('อัปโหลดรูปวิ่งและผลวิ่งเพื่อเริ่มต้น',W/2,H/2); $('info').textContent=''; return;
  }
  view=viewFor(L.W,L.H); const {s,ox,oy}=view;
  if(!L.hasBg) checker(ox,oy,L.W*s,L.H*s);
  renderTo(outCv,L);
  ctx.imageSmoothingQuality='high'; ctx.drawImage(outCv,ox,oy,L.W*s,L.H*s);
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; ctx.strokeRect(ox,oy,L.W*s,L.H*s);
  if(L.hasBg&&fgImg){
    const r=fgRectDisplay(L);
    ctx.setLineDash([6,4]); ctx.strokeStyle='#ff5200'; ctx.lineWidth=1.5; ctx.strokeRect(r.x,r.y,r.w,r.h); ctx.setLineDash([]);
    drawHandles(handlePts(r.x,r.y,r.w,r.h,true));
  }
  $('info').textContent=`ขนาดไฟล์ที่ได้ ${L.W} × ${L.H} px`+(L.hasBg?'':' · (ยังไม่มีรูปวิ่ง: ได้เฉพาะผลวิ่ง + glow พื้นโปร่งใส)');
}

/* ---------- pointer interaction ---------- */
const ptr = e => {const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}};
function cropTarget(){
  if(mode==='bg'&&bgImg) return {img:bgImg,get:()=>bgCrop,set:c=>bgCrop=c,r:RATIOS[ratio].r};
  if(mode==='fg'&&fgImg) return {img:fgImg,get:()=>fgCrop,set:c=>fgCrop=c,r:null};
  return null;
}
function pick(p){
  if(!view) return null;
  const tg=cropTarget();
  if(tg){
    const c=tg.get(), {s,ox,oy}=view, rx=ox+c.x*s, ry=oy+c.y*s, rw=c.w*s, rh=c.h*s;
    const h=hitHandle(handlePts(rx,ry,rw,rh,tg.r!=null),p.x,p.y);
    if(h) return {kind:'resize',h,cur:CURSORS[h]};
    if(p.x>=rx&&p.x<=rx+rw&&p.y>=ry&&p.y<=ry+rh) return {kind:'move',cur:'move'};
    return null;
  }
  if(mode==='compose'&&bgImg&&fgImg){
    const L=layout(), r=fgRectDisplay(L);
    const h=hitHandle(handlePts(r.x,r.y,r.w,r.h,true),p.x,p.y);
    if(h) return {kind:'resize',h,cur:CURSORS[h]};
    if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h) return {kind:'move',cur:'move'};
  }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  const p=ptr(e), hit=pick(p); if(!hit) return;
  cv.setPointerCapture(e.pointerId);
  const tg=cropTarget();
  drag={...hit,p0:p,start:tg?{...tg.get()}:null,L:mode==='compose'?layout():null,t0:{...fgT}};
});
cv.addEventListener('pointermove',e=>{
  const p=ptr(e);
  if(!drag){ const h=pick(p); cv.style.cursor=h?h.cur:'default'; return; }
  const {s,ox,oy}=view, tg=cropTarget();
  if(tg){
    const iw=tg.img.naturalWidth, ih=tg.img.naturalHeight, st=drag.start;
    if(drag.kind==='move'){
      tg.set({...st,x:clamp(st.x+(p.x-drag.p0.x)/s,0,iw-st.w),y:clamp(st.y+(p.y-drag.p0.y)/s,0,ih-st.h)});
    }else{
      tg.set(resizeCrop(st,drag.h,(p.x-ox)/s,(p.y-oy)/s,tg.r,iw,ih));
    }
  }else{
    const L=drag.L;
    if(drag.kind==='move'){
      fgT.nx=clamp(drag.t0.nx+(p.x-drag.p0.x)/s/L.W,0,1);
      fgT.ny=clamp(drag.t0.ny+(p.y-drag.p0.y)/s/L.H,0,1);
    }else{
      const sx=drag.h.includes('e')?1:-1, sy=drag.h.includes('s')?1:-1, fr=L.ow/L.oh;
      const ax=L.cx-sx*L.ow/2, ay=L.cy-sy*L.oh/2, px=(p.x-ox)/s, py=(p.y-oy)/s;
      const w=Math.max(40,Math.abs(px-ax),Math.abs(py-ay)*fr), h=w/fr;
      fgT.fw=w/L.W; fgT.nx=(ax+sx*w/2)/L.W; fgT.ny=(ay+sy*h/2)/L.H;
    }
  }
  syncUI(); redraw();
});
const endDrag=()=>{drag=null};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*.0015);
  if(mode==='compose'&&bgImg&&fgImg) fgT.fw=clamp(fgT.fw*f,.03,3);
  else if(mode==='bg'&&bgImg) bgCrop=scaleRect(bgCrop,1/f,bgImg);
  else if(mode==='fg'&&fgImg) fgCrop=scaleRect(fgCrop,1/f,fgImg);
  syncUI(); redraw();
},{passive:false});

/* ---------- UI sync ---------- */
function syncUI(){
  $('tBg').disabled=!bgImg; $('tFg').disabled=!fgImg; $('tCmp').disabled=!(bgImg||fgImg);
  for(const b of $('tabs').children) b.classList.toggle('on',b.dataset.m===mode);
  $('hint').textContent=HINTS[mode];
  for(const slot of ['bg','fg']){
    const z=$(slot==='bg'?'upBg':'upFg'), has=!!(slot==='bg'?bgImg:fgImg);
    z.classList.toggle('has',has);
    z.style.backgroundImage=has?`url(${urls[slot]})`:'';
    z.querySelector('.x').hidden=!has;
  }
  for(const b of $('ratios').children) b.classList.toggle('on',b.dataset.r===ratio);
  $('zoom').disabled=$('resetBg').disabled=!bgImg;
  if(bgImg){
    const z=clamp(100*maxRect(bgImg,RATIOS[ratio].r).w/bgCrop.w,100,500);
    $('zoom').value=z; $('vZoom').textContent=Math.round(z)+' %';
  }
  $('fsize').disabled=!(bgImg&&fgImg); $('resetFg').disabled=!fgImg;
  $('fsize').value=clamp(fgT.fw*100,5,200); $('vF').textContent=Math.round(fgT.fw*100)+' %';
  $('dl').disabled=!layout();
}
function setMode(m){mode=m;syncUI();redraw()}

/* ---------- uploads ---------- */
function loadInto(slot,f){
  if(!f||!f.type.startsWith('image/')) return;
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{
    if(urls[slot]) URL.revokeObjectURL(urls[slot]);
    urls[slot]=url;
    const nm=f.name.replace(/\.[^.]+$/,'')||slot;
    if(slot==='bg'){
      bgImg=im; bgName=nm; bgCrop=maxRect(im,RATIOS[ratio].r);
      if(fgImg) fgT.fw=defaultFw();
      mode='bg';
    }else{
      fgImg=im; fgName=nm; fgVer++; fgCrop=maxRect(im,null);
      fgT={nx:.5,ny:.5,fw:defaultFw()}; mode='compose';
    }
    syncUI(); redraw();
  };
  im.onerror=()=>{URL.revokeObjectURL(url);alert('เปิดไฟล์รูปนี้ไม่ได้')};
  im.src=url;
}
function removeSlot(slot){
  if(urls[slot]){URL.revokeObjectURL(urls[slot]);urls[slot]=null}
  if(slot==='bg'){bgImg=null;bgCrop=null;$('fileBg').value=''}
  else{fgImg=null;fgCrop=null;$('fileFg').value=''}
  if(mode==='bg'&&!bgImg) mode='compose';
  if(mode==='fg'&&!fgImg) mode='compose';
  syncUI(); redraw();
}
for(const [zid,fid,slot] of [['upBg','fileBg','bg'],['upFg','fileFg','fg']]){
  const z=$(zid), fi=$(fid);
  z.addEventListener('click',()=>fi.click());
  fi.addEventListener('change',e=>{loadInto(slot,e.target.files[0]);fi.value=''});
  z.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();removeSlot(slot)});
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();z.classList.remove('over');loadInto(slot,e.dataTransfer.files[0])});
}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();loadInto(bgImg?'fg':'bg',e.dataTransfer.files[0])});
document.addEventListener('paste',e=>{
  for(const it of e.clipboardData.items) if(it.type.startsWith('image/')){loadInto(bgImg?'fg':'bg',it.getAsFile());break}
});

/* ---------- controls ---------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)setMode(b.dataset.m)});
$('ratios').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  ratio=b.dataset.r;
  if(bgImg) bgCrop=maxRect(bgImg,RATIOS[ratio].r);
  syncUI(); redraw();
});
$('zoom').addEventListener('input',()=>{
  if(!bgImg) return;
  const w=maxRect(bgImg,RATIOS[ratio].r).w/($('zoom').value/100);
  bgCrop=scaleRect(bgCrop,w/bgCrop.w,bgImg); syncUI(); redraw();
});
$('fsize').addEventListener('input',()=>{fgT.fw=$('fsize').value/100;syncUI();redraw()});
$('resetBg').addEventListener('click',()=>{bgCrop=maxRect(bgImg,RATIOS[ratio].r);syncUI();redraw()});
$('resetFg').addEventListener('click',()=>{fgCrop=maxRect(fgImg,null);syncUI();redraw()});
const bind=(id,label,suf)=>$(id).addEventListener('input',()=>{$(label).textContent=$(id).value+suf;syncUI();redraw()});
bind('size','vSize',' px'); bind('op','vOp',' %'); bind('sp','vSp',' %'); bind('pass','vPass','');
$('color').addEventListener('input',()=>{$('hex').value=$('color').value;redraw()});
$('hex').addEventListener('input',()=>{
  let v=$('hex').value.trim(); if(v[0]!=='#') v='#'+v;
  if(/^#[0-9a-f]{6}$/i.test(v)){$('color').value=v;redraw()}
});
new ResizeObserver(redraw).observe(stage);

/* ---------- download ---------- */
$('dl').addEventListener('click',()=>{
  const L=layout(); if(!L) return;
  const c=document.createElement('canvas'); renderTo(c,L);
  c.toBlob(b=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=(fgName||bgName||'image')+(L.hasBg?'-run.png':'-glow.png');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },'image/png');
});

syncUI(); redraw();
</script>
</body>
</html>
