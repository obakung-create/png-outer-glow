<!doctype html>
<html lang="th">
<head>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Composer">
<meta name="theme-color" content="#000000">
<title>Run Composer</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#fff; --text:#000; --muted:#8e8e93; --line:rgba(60,60,67,.18);
    --fill:rgba(118,118,128,.12); --accent:#ff5200; --bar:rgba(249,249,249,.86); --stagebg:#1c1c1e;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#98989f;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--bar:rgba(29,29,31,.86);--stagebg:#0b0b0c}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;
    background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:15px}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  button:disabled{opacity:.35;cursor:not-allowed}

  .app{height:100dvh;display:flex;flex-direction:column}

  /* ---------- nav bar ---------- */
  .nav{flex:none;padding:calc(var(--sat) + 6px) 8px 8px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(var(--sat) + 50px)}
  .nav h1{margin:0;font-size:17px;font-weight:600;text-align:center}
  .nav .l{justify-self:start}.nav .r{justify-self:end}
  .navbtn{font-size:17px;color:var(--accent);padding:8px 10px;border-radius:10px;display:flex;align-items:center;gap:4px}
  .navbtn.bold{font-weight:600}
  .navbtn:active{opacity:.5}
  .navbtn svg{width:22px;height:22px}

  /* ---------- canvas area ---------- */
  .main{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px 0;gap:8px}
  .seg{flex:none;display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
  .seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
  .seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
  @media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
  .stage{flex:1;min-height:120px;border-radius:14px;background:var(--stagebg);overflow:hidden;position:relative}
  .stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .caption{flex:none;text-align:center;color:var(--muted);font-size:12px;line-height:1.35;padding-bottom:6px}
  .caption .info{margin-top:2px;font-variant-numeric:tabular-nums}

  /* ---------- bottom dock ---------- */
  .dock{flex:none;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
  .sheet{max-height:min(34dvh,300px);overflow:auto;padding:14px 16px 6px;-webkit-overflow-scrolling:touch;-webkit-user-select:none}
  .sheet[hidden]{display:none}
  .panel[hidden]{display:none}
  .group{background:var(--card);border-radius:12px;padding:0 14px;margin-bottom:10px}
  .item{padding:11px 0;border-bottom:.5px solid var(--line)}
  .item:last-child{border-bottom:0}
  .lh{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
  .lh span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .item.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .linkbtn{color:var(--accent);font-size:15px;width:100%;text-align:left;padding:12px 0}
  .linkbtn:active{opacity:.5}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;
    box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.16)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill)}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  input[type=range]:disabled{opacity:.4}
  input[type=color]{width:44px;height:30px;border:0;border-radius:8px;padding:0;background:none}
  input[type=text]{width:96px;height:34px;border:0;border-radius:8px;padding:0 10px;background:var(--fill);color:var(--text);font-family:ui-monospace,SFMono-Regular,monospace;font-size:15px;-webkit-user-select:text;user-select:text}

  .ups{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .up{position:relative;height:120px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-align:center;color:var(--muted);font-size:12px;cursor:pointer;overflow:hidden;background-size:cover;background-position:center;background-repeat:no-repeat}
  .up::before{content:"+";font-size:28px;line-height:1;color:var(--accent);font-weight:300}
  .up b{font-size:15px;color:var(--text);font-weight:600}
  .up.over{outline:2px solid var(--accent)}
  .up.has{color:#fff;justify-content:flex-end;gap:0;background-color:#2b2b2e}
  .up.has::before{content:none}
  .up.has b,.up.has small{color:#fff;background:rgba(0,0,0,.5);width:100%;padding:3px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .up .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

  .ratios{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;margin-bottom:6px}
  .ratios::-webkit-scrollbar{display:none}
  .ratios button{flex:none;min-width:64px;background:var(--card);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:600;text-align:center;border:1.5px solid transparent}
  .ratios button small{display:block;color:var(--muted);font-size:10px;font-weight:400}
  .ratios button.on{border-color:var(--accent);color:var(--accent)}

  /* ---------- tab bar ---------- */
  .tabbar{display:flex;padding:6px 4px calc(var(--sab) + 4px)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:4px 0}
  .tabbar button svg{width:26px;height:26px}
  .tabbar button.on{color:var(--accent)}

  /* ---------- result sheet ---------- */
  .modal{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  .modal[hidden]{display:none}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .modal .nav{grid-template-columns:1fr auto 1fr}
  .resbody{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-user-select:auto;user-select:auto}
  .resbox{border-radius:14px;padding:10px;display:flex;justify-content:center;max-width:100%;background-color:#fff;
    background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .resbox img{max-width:100%;max-height:62dvh;display:block;border-radius:6px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
  .save-hint{width:100%;max-width:520px;padding:12px 14px;border-radius:12px;background:var(--card);color:var(--muted);font-size:13px;line-height:1.5;text-align:center}
  .save-hint b{color:var(--text)}
  .primary{width:100%;max-width:520px;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600}
  .primary:active{opacity:.8}
  .resinfo{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">

  <header class="nav">
    <div class="l">
      <button class="navbtn" id="dl" disabled aria-label="ดาวน์โหลด PNG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
      </button>
    </div>
    <h1>Run Composer</h1>
    <div class="r"><button class="navbtn bold" id="finish" disabled>เสร็จสิ้น</button></div>
  </header>

  <main class="main">
    <div class="seg" id="tabs">
      <button id="tBg" data-m="bg" disabled>① ครอปรูปวิ่ง</button>
      <button id="tCmp" data-m="compose" disabled class="on">② จัดวาง</button>
      <button id="tFg" data-m="fg" disabled>③ ครอปผลวิ่ง</button>
    </div>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <div class="caption"><div id="hint"></div><div class="info" id="info"></div></div>
  </main>

  <nav class="dock">
    <div class="sheet" id="sheet">

      <section class="panel" id="p-photo">
        <div class="ups">
          <div class="up" id="upBg" data-slot="bg"><b>รูปวิ่ง</b><small>พื้นหลัง</small><button class="x" hidden title="ลบ">×</button></div>
          <div class="up" id="upFg" data-slot="fg"><b>ผลวิ่ง</b><small>ภาพที่แปะ</small><button class="x" hidden title="ลบ">×</button></div>
        </div>
        <input id="fileBg" type="file" accept="image/*" hidden>
        <input id="fileFg" type="file" accept="image/*" hidden>
      </section>

      <section class="panel" id="p-crop" hidden>
        <div class="ratios" id="ratios">
          <button data-r="4:5" class="on">4:5<small>FB / IG</small></button>
          <button data-r="9:16">9:16<small>Stories</small></button>
          <button data-r="16:9">16:9<small>แนวนอน</small></button>
          <button data-r="1:1">1:1<small>สี่เหลี่ยม</small></button>
          <button data-r="free">อิสระ<small>&nbsp;</small></button>
        </div>
        <div class="group">
          <div class="item">
            <div class="lh"><span>ซูมรูปวิ่ง</span><span id="vZoom">100 %</span></div>
            <input id="zoom" type="range" min="100" max="500" value="100" disabled>
          </div>
          <div class="item"><button class="linkbtn" id="resetBg" disabled>รีเซ็ตครอปรูปวิ่ง</button></div>
        </div>
      </section>

      <section class="panel" id="p-fg" hidden>
        <div class="group">
          <div class="item">
            <div class="lh"><span>ขนาดผลวิ่ง (% ของความกว้างภาพ)</span><span id="vF">60 %</span></div>
            <input id="fsize" type="range" min="5" max="200" value="60" disabled>
          </div>
          <div class="item"><button class="linkbtn" id="resetFg" disabled>รีเซ็ตครอปผลวิ่ง</button></div>
        </div>
      </section>

      <section class="panel" id="p-glow" hidden>
        <div class="group">
          <div class="item">
            <div class="lh"><span>ขนาด (Size)</span><span id="vSize">25 px</span></div>
            <input id="size" type="range" min="0" max="100" value="25">
          </div>
          <div class="item flex">
            <span>สี (Color)</span>
            <span style="display:flex;gap:10px;align-items:center">
              <input id="color" type="color" value="#000000">
              <input id="hex" type="text" value="#000000" maxlength="7">
            </span>
          </div>
          <div class="item">
            <div class="lh"><span>ความเข้ม (Opacity)</span><span id="vOp">55 %</span></div>
            <input id="op" type="range" min="0" max="100" value="55">
          </div>
          <div class="item">
            <div class="lh"><span>Spread</span><span id="vSp">0 %</span></div>
            <input id="sp" type="range" min="0" max="100" value="0">
          </div>
          <div class="item">
            <div class="lh"><span>เพิ่มความหนา (Passes)</span><span id="vPass">2</span></div>
            <input id="pass" type="range" min="1" max="6" value="2">
          </div>
        </div>
      </section>
    </div>

    <div class="tabbar" id="dockTabs">
      <button data-p="photo" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
        รูปภาพ
      </button>
      <button data-p="crop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v15a2 2 0 0 0 2 2h13M2 7h15a2 2 0 0 1 2 2v13"/></svg>
        ครอป
      </button>
      <button data-p="fg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l5-5M4 20v-5M4 20h5M20 4l-5 5M20 4v5M20 4h-5"/><rect x="8" y="8" width="8" height="8" rx="2"/></svg>
        ผลวิ่ง
      </button>
      <button data-p="glow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></svg>
        Glow
      </button>
    </div>
  </nav>

  <div class="modal" id="result" hidden role="dialog" aria-modal="true" aria-label="ผลลัพธ์">
    <header class="nav">
      <div class="l"><button class="navbtn" id="edit">‹ แก้ไข</button></div>
      <h1>ผลลัพธ์</h1>
      <div class="r"></div>
    </header>
    <div class="resbody">
      <div class="resbox"><img id="resImg" alt="ภาพที่แก้ไขเสร็จแล้ว" draggable="false"></div>
      <div class="resinfo" id="resInfo"></div>
      <div class="save-hint">📱 มือถือ: <b>กดค้างที่รูป</b> แล้วเลือก "บันทึกรูปภาพ"<br>คอมพิวเตอร์: คลิกขวาที่รูป หรือกดปุ่มด้านล่าง</div>
      <button class="primary" id="dl2">ดาวน์โหลด PNG</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const RATIOS = {
  '4:5':{r:4/5,W:1080,H:1350}, '9:16':{r:9/16,W:1080,H:1920},
  '16:9':{r:16/9,W:1920,H:1080}, '1:1':{r:1,W:1080,H:1080}, 'free':{r:null}
};
const HINTS = {
  bg:'ลากเพื่อเลื่อน · ลากมุม/ขอบเพื่อย่อ-ขยายพื้นที่ครอป',
  compose:'ลากผลวิ่งเพื่อย้าย · ลากมุมเพื่อย่อ-ขยาย',
  fg:'ครอปผลวิ่งแบบอิสระ: ลากขอบ/มุม · ลากในกรอบเพื่อเลื่อน'
};

let bgImg=null, fgImg=null, bgName='', fgName='', fgVer=0;
let ratio='4:5', bgCrop=null, fgCrop=null;
let fgT = {nx:.5, ny:.5, fw:.6}; // fg centre (0..1 of output) and width (fraction of output width)
let mode='compose', view=null, drag=null;
const urls = {bg:null, fg:null};
const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');
const outCv=document.createElement('canvas');
let glowCache={key:''};

/* ---------- geometry helpers ---------- */
function maxRect(img, r){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  if(!r) return {x:0,y:0,w:iw,h:ih};
  let w,h; if(iw/ih>r){h=ih;w=h*r}else{w=iw;h=w/r}
  return {x:(iw-w)/2,y:(ih-h)/2,w,h};
}
function scaleRect(c,k,img){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  k=Math.min(k, iw/c.w, ih/c.h); k=Math.max(k, 16/c.w, 16/c.h);
  const w=c.w*k, h=c.h*k, cx=c.x+c.w/2, cy=c.y+c.h/2;
  return {x:clamp(cx-w/2,0,iw-w), y:clamp(cy-h/2,0,ih-h), w, h};
}
function resizeCrop(s,handle,px,py,r,iw,ih){
  const MIN=16, L=s.x,T=s.y,R=s.x+s.w,B=s.y+s.h;
  const hw=handle.includes('w'), he=handle.includes('e'), hn=handle.includes('n'), hs=handle.includes('s');
  if(!r){
    let l=L,t=T,rr=R,b=B;
    if(hw) l=clamp(px,0,R-MIN); if(he) rr=clamp(px,L+MIN,iw);
    if(hn) t=clamp(py,0,B-MIN); if(hs) b=clamp(py,T+MIN,ih);
    return {x:l,y:t,w:rr-l,h:b-t};
  }
  const sx=he?1:-1, sy=hs?1:-1, ax=sx>0?L:R, ay=sy>0?T:B;
  const wmax=Math.min(sx>0?iw-ax:ax, (sy>0?ih-ay:ay)*r);
  let w=Math.max(Math.abs(px-ax), Math.abs(py-ay)*r);
  w=clamp(w, Math.min(MIN*Math.max(1,r),wmax), wmax);
  const h=w/r;
  return {x:sx>0?ax:ax-w, y:sy>0?ay:ay-h, w, h};
}
function handlePts(x,y,w,h,locked){
  const p={nw:[x,y],ne:[x+w,y],sw:[x,y+h],se:[x+w,y+h]};
  if(!locked){p.n=[x+w/2,y];p.s=[x+w/2,y+h];p.w=[x,y+h/2];p.e=[x+w,y+h/2]}
  return p;
}
function hitHandle(p,x,y){ for(const k in p) if(Math.hypot(p[k][0]-x,p[k][1]-y)<=22) return k; return null; }
const CURSORS={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize'};

/* ---------- layout / output size ---------- */
const padFor = () => Math.ceil(+$('size').value*1.5)+2;
// Output keeps the native pixel size of the cropped area (no resampling).
// Only scaled down if it would exceed what the browser's canvas can hold.
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const MAX_AREA=IOS?16000000:120000000, MAX_SIDE=16000;
function bgOut(){
  let w=bgCrop.w, h=bgCrop.h;
  const k=Math.min(1,MAX_SIDE/Math.max(w,h),Math.sqrt(MAX_AREA/(w*h)));
  return [Math.max(1,Math.round(w*k)), Math.max(1,Math.round(h*k))];
}
function layout(){
  if(bgImg){
    const [W,H]=bgOut();
    const ow=Math.max(1,Math.round(fgT.fw*W));
    return {W,H,ow,oh:fgImg?Math.max(1,Math.round(ow*fgCrop.h/fgCrop.w)):0,cx:fgT.nx*W,cy:fgT.ny*H,hasBg:true};
  }
  if(fgImg){
    const p=padFor(), ow=Math.round(fgCrop.w), oh=Math.round(fgCrop.h);
    return {W:ow+2*p,H:oh+2*p,ow,oh,cx:(ow+2*p)/2,cy:(oh+2*p)/2,hasBg:false};
  }
  return null;
}
function defaultFw(){
  if(!bgImg||!fgCrop) return .6;
  const [W,H]=bgOut();
  return Math.min(.6, .8*H/W*fgCrop.w/fgCrop.h);
}

/* ---------- glow ---------- */
function glowFor(ow,oh,size){
  const op=+$('op').value/100, spread=+$('sp').value/100,
        passes=+$('pass').value, color=$('color').value;
  const key=[fgVer,fgCrop.x,fgCrop.y,fgCrop.w,fgCrop.h,ow,oh,size,op,spread,passes,color].join('|');
  if(glowCache.key===key) return glowCache;
  const pad=Math.ceil(size*1.5)+2;
  const base=document.createElement('canvas'); base.width=ow; base.height=oh;
  const bx=base.getContext('2d'); bx.imageSmoothingQuality='high';
  bx.drawImage(fgImg,fgCrop.x,fgCrop.y,fgCrop.w,fgCrop.h,0,0,ow,oh);

  const r=size*spread;
  const sil=document.createElement('canvas'); sil.width=ow+pad*2; sil.height=oh+pad*2;
  const sc=sil.getContext('2d');
  if(r>.5){
    const steps=Math.min(64,Math.max(16,Math.round(r*4)));
    for(let ring=1;ring>=.25;ring-=.25)
      for(let k=0;k<steps;k++){const a=k/steps*Math.PI*2; sc.drawImage(base,pad+Math.cos(a)*r*ring,pad+Math.sin(a)*r*ring)}
  }
  sc.drawImage(base,pad,pad);

  const out=document.createElement('canvas'); out.width=sil.width; out.height=sil.height;
  const c=out.getContext('2d'), OFF=100000+sil.width;
  if(size>0&&op>0){
    c.save(); c.shadowColor=color; c.shadowBlur=Math.max(0,size-r)*2; c.shadowOffsetX=OFF; c.globalAlpha=op;
    for(let i=0;i<passes;i++) c.drawImage(sil,-OFF,0);
    c.restore();
  }
  c.drawImage(base,pad,pad);
  glowCache={key,cv:out,pad};
  return glowCache;
}

/* ---------- render the final composite ---------- */
// k = 1 for the real export; < 1 only for the on-screen preview of very large images
function renderTo(c,L,k=1){
  const W=Math.max(1,Math.round(L.W*k)), H=Math.max(1,Math.round(L.H*k));
  if(c.width!==W||c.height!==H){c.width=W;c.height=H}
  const x=c.getContext('2d'); x.clearRect(0,0,W,H);
  if(L.hasBg){ x.imageSmoothingQuality='high'; x.drawImage(bgImg,bgCrop.x,bgCrop.y,bgCrop.w,bgCrop.h,0,0,W,H); }
  if(fgImg){
    const ow=Math.max(1,Math.round(L.ow*k)), oh=Math.max(1,Math.round(L.oh*k));
    const g=glowFor(ow,oh,+$('size').value*k);
    x.drawImage(g.cv,Math.round(L.cx*k-ow/2-g.pad),Math.round(L.cy*k-oh/2-g.pad));
  }
}

/* ---------- stage drawing ---------- */
const pat=document.createElement('canvas'); pat.width=pat.height=16;
{const p=pat.getContext('2d'); p.fillStyle='#fff'; p.fillRect(0,0,16,16); p.fillStyle='#d9d9d9'; p.fillRect(0,0,8,8); p.fillRect(8,8,8,8);}
function checker(x,y,w,h){ctx.save();ctx.translate(x,y);ctx.fillStyle=ctx.createPattern(pat,'repeat');ctx.fillRect(0,0,w,h);ctx.restore()}
function viewFor(iw,ih){
  const W=stage.clientWidth,H=stage.clientHeight,m=20,s=Math.min((W-2*m)/iw,(H-2*m)/ih);
  return {s,ox:(W-iw*s)/2,oy:(H-ih*s)/2};
}
let raf=0;
function redraw(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;draw()}); }
function draw(){
  const dpr=window.devicePixelRatio||1, W=stage.clientWidth, H=stage.clientHeight;
  if(!W||!H) return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  view=null;
  if(mode==='bg'&&bgImg) drawCrop(bgImg,bgCrop,RATIOS[ratio].r!=null);
  else if(mode==='fg'&&fgImg) drawCrop(fgImg,fgCrop,false);
  else drawCompose(W,H);
}
function drawCrop(img,c,locked){
  const iw=img.naturalWidth, ih=img.naturalHeight; view=viewFor(iw,ih); const {s,ox,oy}=view;
  checker(ox,oy,iw*s,ih*s);
  ctx.drawImage(img,ox,oy,iw*s,ih*s);
  const rx=ox+c.x*s, ry=oy+c.y*s, rw=c.w*s, rh=c.h*s;
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.fillRect(ox,oy,iw*s,ry-oy); ctx.fillRect(ox,ry+rh,iw*s,oy+ih*s-ry-rh);
  ctx.fillRect(ox,ry,rx-ox,rh); ctx.fillRect(rx+rw,ry,ox+iw*s-rx-rw,rh);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<3;i++){ctx.moveTo(rx+rw*i/3,ry);ctx.lineTo(rx+rw*i/3,ry+rh);ctx.moveTo(rx,ry+rh*i/3);ctx.lineTo(rx+rw,ry+rh*i/3)}
  ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(rx,ry,rw,rh);
  drawHandles(handlePts(rx,ry,rw,rh,locked));
  $('info').textContent=`พื้นที่ครอป ${Math.round(c.w)} × ${Math.round(c.h)} px (จากต้นฉบับ ${iw} × ${ih})`;
}
function drawHandles(p){
  ctx.fillStyle='#fff'; ctx.strokeStyle='#ff5200'; ctx.lineWidth=2;
  for(const k in p){ctx.beginPath();ctx.arc(p[k][0],p[k][1],8,0,Math.PI*2);ctx.fill();ctx.stroke()}
}
function fgRectDisplay(L){
  const {s,ox,oy}=view;
  return {x:ox+(L.cx-L.ow/2)*s, y:oy+(L.cy-L.oh/2)*s, w:L.ow*s, h:L.oh*s};
}
function drawCompose(W,H){
  const L=layout();
  if(!L){
    ctx.fillStyle='#98989d'; ctx.font='15px -apple-system,system-ui'; ctx.textAlign='center';
    ctx.fillText('แตะแท็บ "รูปภาพ" เพื่อเลือกรูปวิ่งและผลวิ่ง',W/2,H/2); $('info').textContent=''; return;
  }
  view=viewFor(L.W,L.H); const {s,ox,oy}=view;
  if(!L.hasBg) checker(ox,oy,L.W*s,L.H*s);
  renderTo(outCv,L,Math.min(1,1600/Math.max(L.W,L.H)));
  ctx.imageSmoothingQuality='high'; ctx.drawImage(outCv,ox,oy,L.W*s,L.H*s);
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; ctx.strokeRect(ox,oy,L.W*s,L.H*s);
  if(L.hasBg&&fgImg){
    const r=fgRectDisplay(L);
    ctx.setLineDash([6,4]); ctx.strokeStyle='#ff5200'; ctx.lineWidth=1.5; ctx.strokeRect(r.x,r.y,r.w,r.h); ctx.setLineDash([]);
    drawHandles(handlePts(r.x,r.y,r.w,r.h,true));
  }
  $('info').textContent=`ขนาดไฟล์ที่ได้ ${L.W} × ${L.H} px`+(L.hasBg?'':' · (ยังไม่มีรูปวิ่ง: ได้เฉพาะผลวิ่ง + glow พื้นโปร่งใส)');
}

/* ---------- pointer interaction ---------- */
const ptr = e => {const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}};
function cropTarget(){
  if(mode==='bg'&&bgImg) return {img:bgImg,get:()=>bgCrop,set:c=>bgCrop=c,r:RATIOS[ratio].r};
  if(mode==='fg'&&fgImg) return {img:fgImg,get:()=>fgCrop,set:c=>fgCrop=c,r:null};
  return null;
}
function pick(p){
  if(!view) return null;
  const tg=cropTarget();
  if(tg){
    const c=tg.get(), {s,ox,oy}=view, rx=ox+c.x*s, ry=oy+c.y*s, rw=c.w*s, rh=c.h*s;
    const h=hitHandle(handlePts(rx,ry,rw,rh,tg.r!=null),p.x,p.y);
    if(h) return {kind:'resize',h,cur:CURSORS[h]};
    if(p.x>=rx&&p.x<=rx+rw&&p.y>=ry&&p.y<=ry+rh) return {kind:'move',cur:'move'};
    return null;
  }
  if(mode==='compose'&&bgImg&&fgImg){
    const L=layout(), r=fgRectDisplay(L);
    const h=hitHandle(handlePts(r.x,r.y,r.w,r.h,true),p.x,p.y);
    if(h) return {kind:'resize',h,cur:CURSORS[h]};
    if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h) return {kind:'move',cur:'move'};
  }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  const p=ptr(e), hit=pick(p); if(!hit) return;
  cv.setPointerCapture(e.pointerId);
  const tg=cropTarget();
  drag={...hit,p0:p,start:tg?{...tg.get()}:null,L:mode==='compose'?layout():null,t0:{...fgT}};
});
cv.addEventListener('pointermove',e=>{
  const p=ptr(e);
  if(!drag){ const h=pick(p); cv.style.cursor=h?h.cur:'default'; return; }
  const {s,ox,oy}=view, tg=cropTarget();
  if(tg){
    const iw=tg.img.naturalWidth, ih=tg.img.naturalHeight, st=drag.start;
    if(drag.kind==='move'){
      tg.set({...st,x:clamp(st.x+(p.x-drag.p0.x)/s,0,iw-st.w),y:clamp(st.y+(p.y-drag.p0.y)/s,0,ih-st.h)});
    }else{
      tg.set(resizeCrop(st,drag.h,(p.x-ox)/s,(p.y-oy)/s,tg.r,iw,ih));
    }
  }else{
    const L=drag.L;
    if(drag.kind==='move'){
      fgT.nx=clamp(drag.t0.nx+(p.x-drag.p0.x)/s/L.W,0,1);
      fgT.ny=clamp(drag.t0.ny+(p.y-drag.p0.y)/s/L.H,0,1);
    }else{
      const sx=drag.h.includes('e')?1:-1, sy=drag.h.includes('s')?1:-1, fr=L.ow/L.oh;
      const ax=L.cx-sx*L.ow/2, ay=L.cy-sy*L.oh/2, px=(p.x-ox)/s, py=(p.y-oy)/s;
      const w=Math.max(40,Math.abs(px-ax),Math.abs(py-ay)*fr), h=w/fr;
      fgT.fw=w/L.W; fgT.nx=(ax+sx*w/2)/L.W; fgT.ny=(ay+sy*h/2)/L.H;
    }
  }
  syncUI(); redraw();
});
const endDrag=()=>{drag=null};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*.0015);
  if(mode==='compose'&&bgImg&&fgImg) fgT.fw=clamp(fgT.fw*f,.03,3);
  else if(mode==='bg'&&bgImg) bgCrop=scaleRect(bgCrop,1/f,bgImg);
  else if(mode==='fg'&&fgImg) fgCrop=scaleRect(fgCrop,1/f,fgImg);
  syncUI(); redraw();
},{passive:false});

/* ---------- UI sync ---------- */
function syncUI(){
  $('tBg').disabled=!bgImg; $('tFg').disabled=!fgImg; $('tCmp').disabled=!(bgImg||fgImg);
  for(const b of $('tabs').children) b.classList.toggle('on',b.dataset.m===mode);
  $('hint').textContent=HINTS[mode];
  for(const slot of ['bg','fg']){
    const z=$(slot==='bg'?'upBg':'upFg'), has=!!(slot==='bg'?bgImg:fgImg);
    z.classList.toggle('has',has);
    z.style.backgroundImage=has?`url(${urls[slot]})`:'';
    z.querySelector('.x').hidden=!has;
  }
  for(const b of $('ratios').children) b.classList.toggle('on',b.dataset.r===ratio);
  $('zoom').disabled=$('resetBg').disabled=!bgImg;
  if(bgImg){
    const z=clamp(100*maxRect(bgImg,RATIOS[ratio].r).w/bgCrop.w,100,500);
    $('zoom').value=z; $('vZoom').textContent=Math.round(z)+' %';
  }
  $('fsize').disabled=!(bgImg&&fgImg); $('resetFg').disabled=!fgImg;
  $('fsize').value=clamp(fgT.fw*100,5,200); $('vF').textContent=Math.round(fgT.fw*100)+' %';
  $('dl').disabled=$('finish').disabled=!layout();
}
function setMode(m){mode=m;syncUI();redraw()}

/* ---------- uploads ---------- */
function loadInto(slot,f){
  if(!f||!f.type.startsWith('image/')) return;
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{
    if(urls[slot]) URL.revokeObjectURL(urls[slot]);
    urls[slot]=url;
    const nm=f.name.replace(/\.[^.]+$/,'')||slot;
    if(slot==='bg'){
      bgImg=im; bgName=nm; bgCrop=maxRect(im,RATIOS[ratio].r);
      if(fgImg) fgT.fw=defaultFw();
      mode='bg';
    }else{
      fgImg=im; fgName=nm; fgVer++; fgCrop=maxRect(im,null);
      fgT={nx:.5,ny:.5,fw:defaultFw()}; mode='compose';
    }
    syncUI(); redraw();
  };
  im.onerror=()=>{URL.revokeObjectURL(url);alert('เปิดไฟล์รูปนี้ไม่ได้')};
  im.src=url;
}
function removeSlot(slot){
  if(urls[slot]){URL.revokeObjectURL(urls[slot]);urls[slot]=null}
  if(slot==='bg'){bgImg=null;bgCrop=null;$('fileBg').value=''}
  else{fgImg=null;fgCrop=null;$('fileFg').value=''}
  if(mode==='bg'&&!bgImg) mode='compose';
  if(mode==='fg'&&!fgImg) mode='compose';
  syncUI(); redraw();
}
for(const [zid,fid,slot] of [['upBg','fileBg','bg'],['upFg','fileFg','fg']]){
  const z=$(zid), fi=$(fid);
  z.addEventListener('click',()=>fi.click());
  fi.addEventListener('change',e=>{loadInto(slot,e.target.files[0]);fi.value=''});
  z.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();removeSlot(slot)});
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();z.classList.remove('over');loadInto(slot,e.dataTransfer.files[0])});
}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();loadInto(bgImg?'fg':'bg',e.dataTransfer.files[0])});
document.addEventListener('paste',e=>{
  for(const it of e.clipboardData.items) if(it.type.startsWith('image/')){loadInto(bgImg?'fg':'bg',it.getAsFile());break}
});

/* ---------- controls ---------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)setMode(b.dataset.m)});
$('ratios').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  ratio=b.dataset.r;
  if(bgImg) bgCrop=maxRect(bgImg,RATIOS[ratio].r);
  syncUI(); redraw();
});
$('zoom').addEventListener('input',()=>{
  if(!bgImg) return;
  const w=maxRect(bgImg,RATIOS[ratio].r).w/($('zoom').value/100);
  bgCrop=scaleRect(bgCrop,w/bgCrop.w,bgImg); syncUI(); redraw();
});
$('fsize').addEventListener('input',()=>{fgT.fw=$('fsize').value/100;syncUI();redraw()});
$('resetBg').addEventListener('click',()=>{bgCrop=maxRect(bgImg,RATIOS[ratio].r);syncUI();redraw()});
$('resetFg').addEventListener('click',()=>{fgCrop=maxRect(fgImg,null);syncUI();redraw()});
const bind=(id,label,suf)=>$(id).addEventListener('input',()=>{$(label).textContent=$(id).value+suf;syncUI();redraw()});
bind('size','vSize',' px'); bind('op','vOp',' %'); bind('sp','vSp',' %'); bind('pass','vPass','');
$('color').addEventListener('input',()=>{$('hex').value=$('color').value;redraw()});
$('hex').addEventListener('input',()=>{
  let v=$('hex').value.trim(); if(v[0]!=='#') v='#'+v;
  if(/^#[0-9a-f]{6}$/i.test(v)){$('color').value=v;redraw()}
});
new ResizeObserver(redraw).observe(stage);

/* ---------- bottom tab bar (iOS style) ---------- */
let curPanel='photo';
function showPanel(p){
  curPanel=p;
  for(const b of $('dockTabs').children) b.classList.toggle('on',b.dataset.p===p);
  $('sheet').hidden=!p;
  for(const s of $('sheet').children) s.hidden=s.id!=='p-'+p;
}
$('dockTabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const p=b.dataset.p;
  if(p===curPanel){ // tapping the active tab again collapses the sheet
    curPanel=null; for(const x of $('dockTabs').children) x.classList.remove('on'); $('sheet').hidden=true;
  }else{
    showPanel(p);
    if(p==='crop'&&bgImg) setMode('bg');
    else if(p==='fg'&&fgImg) setMode('fg');
    else if(p==='glow'&&(bgImg||fgImg)) setMode('compose');
  }
  setTimeout(redraw,50);
});
showPanel('photo');

/* ---------- download ---------- */
const fileName=()=>(fgName||bgName||'image')+(bgImg?'-run.png':'-glow.png');
function makeBlob(cb){
  const L=layout(); if(!L) return;
  const c=document.createElement('canvas'); renderTo(c,L);
  c.toBlob(b=>cb(b,L),'image/png');
}
function downloadBlob(b,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('dl').addEventListener('click',()=>makeBlob(b=>downloadBlob(b,fileName())));

/* ---------- finish / edit ---------- */
let resBlob=null, resUrl=null;
$('finish').addEventListener('click',()=>makeBlob((b,L)=>{
  resBlob=b; if(resUrl) URL.revokeObjectURL(resUrl);
  resUrl=URL.createObjectURL(b); $('resImg').src=resUrl;
  $('resInfo').textContent=`${L.W} × ${L.H} px · ${(b.size/1024/1024).toFixed(2)} MB · PNG`;
  $('result').hidden=false;
  $('result').querySelector('.resbody').scrollTop=0;
}));
function closeResult(){
  if($('result').hidden) return;
  $('result').hidden=true;
  if(resUrl){URL.revokeObjectURL(resUrl);resUrl=null} $('resImg').removeAttribute('src'); resBlob=null;
}
$('edit').addEventListener('click',closeResult);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeResult()});
$('dl2').addEventListener('click',()=>{ if(resBlob) downloadBlob(resBlob,fileName()); });

syncUI(); redraw();
</script>
</body>
</html>
