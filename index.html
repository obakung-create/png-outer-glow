<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PNG Outer Glow</title>
<style>
  :root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#ff5200}
  @media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#232326;--text:#f5f5f7;--muted:#98989d;--line:#3a3a3e}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:22px 12px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
  .drop.over{border-color:var(--accent);color:var(--accent)}
  .drop b{color:var(--text);display:block;margin-bottom:4px}
  label{display:flex;justify-content:space-between;font-size:14px;margin:16px 0 6px}
  label span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center}
  input[type=color]{width:48px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:none;cursor:pointer}
  input[type=text]{flex:1;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--card);color:var(--text);font-family:ui-monospace,monospace}
  .chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:16px}
  button.dl{width:100%;margin-top:18px;height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button.dl:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
  .bgs{display:flex;gap:6px;margin-bottom:10px}
  .bgs button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  .bgs button.on{border-color:var(--accent);color:var(--accent)}
  .stage{min-height:360px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px;
    background-color:#fff;
    background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .stage.white{background:#fff}.stage.gray{background:#8a8a8e}.stage.dark{background:#111}
  .stage img{max-width:100%;max-height:70vh;display:block}
  .empty{color:#999;font-size:14px}
  .info{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>PNG Outer Glow</h1>
  <div class="grid">
    <div class="card">
      <div class="drop" id="drop">
        <b>อัปโหลดไฟล์ PNG</b>
        คลิก / ลากไฟล์มาวาง / กด Ctrl+V วางรูป
        <input id="file" type="file" accept="image/png,image/*" hidden>
      </div>

      <label><span>ขนาด (Size)</span><span id="vSize">25 px</span></label>
      <input id="size" type="range" min="0" max="100" value="25">

      <label><span>สี (Color)</span></label>
      <div class="row">
        <input id="color" type="color" value="#000000">
        <input id="hex" type="text" value="#000000" maxlength="7">
      </div>

      <label><span>ความเข้ม (Opacity)</span><span id="vOp">55 %</span></label>
      <input id="op" type="range" min="0" max="100" value="55">

      <label><span>Spread</span><span id="vSp">0 %</span></label>
      <input id="sp" type="range" min="0" max="100" value="0">

      <label><span>เพิ่มความหนา (Passes)</span><span id="vPass">2</span></label>
      <input id="pass" type="range" min="1" max="6" value="2">

      <div class="chk"><input id="expand" type="checkbox" checked><label for="expand" style="margin:0;display:inline">ขยาย canvas ให้พอดีกับ glow</label></div>

      <button class="dl" id="dl" disabled>ดาวน์โหลด PNG (พื้นหลังโปร่งใส)</button>
      <div class="hint">มือถือ: กดค้างที่รูปตัวอย่างเพื่อบันทึก</div>
    </div>

    <div class="card">
      <div class="bgs" id="bgs">
        <button data-bg="" class="on">โปร่งใส</button>
        <button data-bg="white">ขาว</button>
        <button data-bg="gray">เทา</button>
        <button data-bg="dark">ดำ</button>
      </div>
      <div class="stage" id="stage"><span class="empty">ยังไม่มีรูป</span></div>
      <div class="info" id="info"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let img = null, name = 'image', blobUrl = null, lastBlob = null, timer = null;

function loadFile(f){
  if(!f || !f.type.startsWith('image/')) return;
  name = f.name.replace(/\.[^.]+$/, '') || 'image';
  const url = URL.createObjectURL(f);
  const i = new Image();
  i.onload = () => { img = i; URL.revokeObjectURL(url); render(); };
  i.src = url;
}

function render(){
  if(!img) return;
  const size = +$('size').value, opacity = +$('op').value/100,
        spread = +$('sp').value/100, passes = +$('pass').value,
        color = $('color').value, expand = $('expand').checked;
  const w = img.naturalWidth, h = img.naturalHeight;
  const pad = expand ? Math.ceil(size*1.5)+2 : 0;

  // 1) silhouette dilated by (size * spread) — the "spread" part of the glow
  const r = size*spread;
  const sil = document.createElement('canvas');
  sil.width = w+pad*2; sil.height = h+pad*2;
  const sc = sil.getContext('2d');
  if(r > 0.5){
    const steps = Math.min(64, Math.max(16, Math.round(r*4)));
    for(let ring=1; ring>=0.25; ring-=0.25)
      for(let k=0;k<steps;k++){
        const a = k/steps*Math.PI*2;
        sc.drawImage(img, pad+Math.cos(a)*r*ring, pad+Math.sin(a)*r*ring);
      }
  }
  sc.drawImage(img, pad, pad);

  // 2) blur it with shadowBlur (works in every browser), tinted with chosen colour
  const out = document.createElement('canvas');
  out.width = sil.width; out.height = sil.height;
  const c = out.getContext('2d');
  const OFF = 100000 + sil.width;
  const blur = Math.max(0, size - r);
  if(size > 0 && opacity > 0){
    c.save();
    c.shadowColor = color;
    c.shadowBlur = blur*2;       // shadowBlur = 2 × sigma
    c.shadowOffsetX = OFF;
    c.globalAlpha = opacity;
    for(let i=0;i<passes;i++) c.drawImage(sil, -OFF, 0);
    c.restore();
  }
  // 3) original on top
  c.drawImage(img, pad, pad);

  out.toBlob(b => {
    lastBlob = b;
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(b);
    $('stage').innerHTML = '';
    const im = new Image(); im.src = blobUrl; im.alt = 'preview';
    $('stage').appendChild(im);
    $('dl').disabled = false;
    $('info').textContent = `${out.width} × ${out.height} px · ${(b.size/1024).toFixed(0)} KB`;
  }, 'image/png');
}
function schedule(){ clearTimeout(timer); timer = setTimeout(render, 40); }

// controls
const bind = (id, label, suffix) => $(id).addEventListener('input', () => { $(label).textContent = $(id).value + suffix; schedule(); });
bind('size','vSize',' px'); bind('op','vOp',' %'); bind('sp','vSp',' %'); bind('pass','vPass','');
$('expand').addEventListener('change', schedule);
$('color').addEventListener('input', () => { $('hex').value = $('color').value; schedule(); });
$('hex').addEventListener('input', () => {
  let v = $('hex').value.trim(); if(v[0] !== '#') v = '#'+v;
  if(/^#[0-9a-f]{6}$/i.test(v)){ $('color').value = v; schedule(); }
});
$('bgs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('bgs').children].forEach(x => x.classList.toggle('on', x === b));
  $('stage').className = 'stage ' + b.dataset.bg;
});

// upload
$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => loadFile(e.target.files[0]));
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
document.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  for(const it of e.clipboardData.items) if(it.type.startsWith('image/')){ loadFile(it.getAsFile()); break; }
});

// download
$('dl').addEventListener('click', () => {
  if(!lastBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastBlob);
  a.download = name + '-glow.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
</script>
</body>
</html>
